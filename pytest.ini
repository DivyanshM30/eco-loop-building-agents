[pytest]
# Put the repo root on sys.path so `from src...` imports resolve.
#
# Without this, a bare `pytest` fails with ModuleNotFoundError: No module named
# 'src'. Only `python -m pytest` works, because that form implicitly prepends
# the current directory to sys.path. pytest itself does not — with the default
# "prepend" import mode it inserts the test file's own directory (tests/), not
# the project root. Requires pytest >= 7.0.
pythonpath = .

testpaths = tests
addopts = -q
