# Eco-Loop Building Agents — single source of truth for all runtime settings.
# Nothing in src/ hardcodes a path or a bound. Change it here.

energyplus:
  # Directory containing the `pyenergyplus/` package (the EnergyPlus install root).
  # Use FORWARD slashes: this is YAML, so "\" in a quoted string is an escape char.
  # Windows : C:/EnergyPlusV26-1-0
  # Linux   : /usr/local/EnergyPlus-26-1-0
  # macOS   : /Applications/EnergyPlus-26-1-0
  #
  # After installing, confirm the real folder name — the version suffix must match:
  #   Get-ChildItem C:\ -Directory -Filter 'EnergyPlus*' |
  #     Where-Object { Test-Path (Join-Path $_.FullName 'pyenergyplus') }
  install_root: "D:/Applications/Energyplus"
  epw: "D:/Applications/Energyplus/WeatherData/USA_IL_Chicago-OHare.Intl.AP.725300_TMY3.epw"

  # Swap the model freely — see scripts/instrument_idf.py to prepare a new one.
  # Option A (recommended, realistic loads):
  #   ExampleFiles/RefBldgSmallOfficeNew2004_Chicago.idf
  # Option B (smaller, faster iterations):
  #   ExampleFiles/5ZoneAirCooled.idf
  idf: "models/ai_instrumented.idf"

  output_dir_baseline: "out_baseline"
  output_dir_ai: "out_ai"
  console_output: false

# Zones to control. MUST match the zone names in your IDF (uppercase in the API).
# For RefBldgSmallOfficeNew2004 the core/perimeter zones are named like:
#   CORE_ZN, PERIMETER_ZN_1, PERIMETER_ZN_2, PERIMETER_ZN_3, PERIMETER_ZN_4
# For 5ZoneAirCooled:
#   SPACE1-1, SPACE2-1, SPACE3-1, SPACE4-1, SPACE5-1
# Run `python scripts/dump_actuators.py` after a first run to confirm.
zones:
  - "CORE_ZN"
  - "PERIMETER_ZN_1"
  - "PERIMETER_ZN_2"
  - "PERIMETER_ZN_3"
  - "PERIMETER_ZN_4"

# People object names for PMV output (key is the People object, NOT the zone).
# Leave empty to auto-skip PMV; scripts/instrument_idf.py prints the real names.
people_objects:
  - "CORE_ZN PEOPLE"
  - "PERIMETER_ZN_1 PEOPLE"
  - "PERIMETER_ZN_2 PEOPLE"
  - "PERIMETER_ZN_3 PEOPLE"
  - "PERIMETER_ZN_4 PEOPLE"

sensors:
  variables:
    - { name: "Zone Mean Air Temperature", key: "__ZONE__" }
    # Occupant count is what makes comfort scoring honest: PMV and unmet hours
    # are only meaningful when someone is actually in the zone. Without this,
    # night/weekend setback hours drag the comfort metrics down and a correct
    # energy-saving policy looks like a comfort regression.
    - { name: "Zone People Occupant Count", key: "__ZONE__" }
    - { name: "Zone Air Relative Humidity", key: "__ZONE__" }
    - { name: "Zone Heating Setpoint Not Met Time", key: "__ZONE__" }
    - { name: "Zone Cooling Setpoint Not Met Time", key: "__ZONE__" }
    - { name: "Site Outdoor Air Drybulb Temperature", key: "ENVIRONMENT" }
  # role -> meter name. The ROLE is what the code refers to; the NAME is
  # model-specific, so only this file needs to change between models.
  #
  # 'Electricity:Facility' does NOT exist in every model — RefBldgSmallOffice
  # exposes ElectricityPurchased:Facility / ElectricityNet:Facility instead.
  # Run `python scripts/dump_api_data.py` to see what your model actually has.
  # With no on-site generation, Purchased == Net.
  meters:
    electricity: "ElectricityPurchased:Facility"
    gas: "NaturalGas:Facility"

# Tier 1 hard safety limits. The clamp is applied AFTER schema validation,
# so a hallucinated setpoint can never reach the simulation.
limits:
  cooling_sp_min_c: 22.0
  cooling_sp_max_c: 28.0
  heating_sp_min_c: 16.0
  heating_sp_max_c: 22.0
  min_deadband_c: 2.0
  max_setback_c: 5.0
  max_precool_hours: 4

# Default (fallback) policy. Also the Gate-2 "hardcoded policy" baseline-beater.
#
# Tuned from the first honest A/B run, which showed baseline PMV of -0.39 during
# occupied hours: the stock schedule OVERCOOLS. Raising the occupied cooling
# setpoint therefore saves energy AND moves comfort toward neutral — the two
# goals are aligned here, not in tension.
#
# occupied_hours is only a fallback: when 'Zone People Occupant Count' is
# available, setback follows measured occupancy, which correctly handles
# weekends. A clock-only rule conditions the building all weekend and loses to
# the baseline.
default_policy:
  occupied_hours: [7, 19]     # fallback only; inclusive start, exclusive end
  cooling_sp_c: 25.5          # was 24.0 — baseline overcools (PMV -0.39)
  heating_sp_c: 20.0
  night_setback_c: 4.0        # deeper unoccupied setback
  precool_hours: 0

agent:
  enabled: true
  # How often the cognitive tier re-derives policy, in SIMULATION hours.
  # 24 = once per simulated day. Lower it for the demo, raise it for annual runs.
  cadence_sim_hours: 24

  # A 7-day simulation runs in ~1.5 s of wall clock while a local LLM call takes
  # tens of seconds. The async agent therefore gets ONE shot per short run: the
  # sim races past every later cadence point while the first call is still in
  # flight, and the busy guard (correctly) skips them. warm_start blocks the
  # simulation for the FIRST policy only, so every run contains at least one
  # LLM-authored policy; subsequent invocations stay fully asynchronous and
  # off the critical path.
  warm_start: true

  # Generous enough for a 3B model on CPU. The reflex tier still runs regardless,
  # so a slow model costs invocations, never correctness.
  timeout_s: 120
  max_retries: 2
  aggregate_window_hours: 24

llm:
  # Written against the OpenAI-compatible /chat/completions interface.
  #   Ollama : base_url http://localhost:11434/v1   (start with `ollama serve`)
  #   vLLM   : base_url http://localhost:8000/v1
  base_url: "http://localhost:11434/v1"
  # llama3.2:3b (~2 GB) is enough for this narrow JSON-emitting task and pulls
  # fast. For better schema adherence swap to llama3.1:8b or qwen2.5:7b-instruct
  # (~4.7 GB) — no code change, just this line.
  model: "llama3.2:3b"
  api_key: "not-needed-for-local"
  # 0.0 for reproducibility. With ~2 invocations per short run, a single sampled
  # policy governs most of the week, so temperature 0.2 produced a 0.85-4.35%
  # spread across otherwise identical runs. A control system should be
  # deterministic given the same inputs.
  temperature: 0.0
  # A policy is a small JSON object; 400 tokens is ample and roughly halves
  # generation time versus 900 on a CPU-bound local model.
  max_tokens: 400
  # Ollama and vLLM both honour this; it is the single biggest reliability win.
  force_json: true

carbon:
  # Synthetic diurnal grid-intensity curve (gCO2/kWh). Documented assumption,
  # swap for real ElectricityMaps/WattTime data if you have a key.
  base_g_per_kwh: 380.0
  peak_g_per_kwh: 620.0
  peak_hours: [17, 21]
  trough_hours: [1, 5]
  trough_g_per_kwh: 250.0

paths:
  results_dir: "results"
  store_dir: "results/store"
